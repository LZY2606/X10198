[package]
name = "phase-weave"
version = "0.1.0"
edition = "2021"
description = "相位织图: offline family genotype/haplotype phasing review"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 2

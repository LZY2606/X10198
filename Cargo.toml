[package]
name = "phase_weave"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["form", "http1", "json", "matched-path", "query", "tokio", "tower-log"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.114"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }

[profile.dev]
opt-level = 0

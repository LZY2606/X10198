[package]
name = "phase_weave"
version = "0.1.0"
edition = "2021"
description = "相位织图: offline pedigree haplotype phasing review (Rust + Axum + SQLite)"

[dependencies]
anyhow = "1"
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[profile.release]
opt-level = 2
